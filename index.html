<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Georgia, serif;
      background: radial-gradient(circle at top, #fff8f8, #f8dfe4 55%, #eebfc9);
    }

    .scene {
      text-align: center;
      position: relative;
    }

    .title {
      color: #7c2638;
      margin-bottom: 35px;
      font-size: 22px;
      transition: 0.7s;
    }

    .gift {
      position: relative;
      width: 170px;
      height: 140px;
      cursor: pointer;
      margin: auto;
      transition: 1s;
    }

    .box {
      position: absolute;
      bottom: 0;
      width: 170px;
      height: 115px;
      background: #b92947;
      border-radius: 5px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.18);
    }

    .ribbon-v {
      position: absolute;
      width: 28px;
      height: 115px;
      background: #f1d5a2;
      left: 71px;
    }

    .lid {
      position: absolute;
      width: 190px;
      height: 35px;
      left: -10px;
      top: 10px;
      background: #cf3655;
      border-radius: 5px;
      z-index: 3;
      transition: 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .ribbon-lid {
      position: absolute;
      width: 28px;
      height: 35px;
      background: #f1d5a2;
      left: 81px;
    }

    .bow {
      position: absolute;
      top: -20px;
      left: 56px;
      font-size: 55px;
      z-index: 5;
    }

    .gift.open .lid {
      transform: translateY(-100px) rotate(-12deg);
    }

    .gift.open {
      transform: translateY(70px);
      opacity: 0;
      pointer-events: none;
    }

    .flowers {
      opacity: 0;
      transform: translateY(100px) scale(0.6);
      transition: 1.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
      position: absolute;
      width: 100%;
      top: -90px;
    }

    .flowers.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .roses {
      font-size: 64px;
      filter: drop-shadow(0 10px 7px rgba(0, 0, 0, 0.15));
    }

    .flowers p {
      color: #76283a;
      font-size: 18px;
      margin-top: 10px;
    }

    .card-container {
      perspective: 1200px;
      width: 310px;
      height: 210px;
      margin: auto;
      opacity: 0;
      transform: translateY(80px);
      transition: 1s;
      pointer-events: none;
    }

    .card-container.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.9s;
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 15px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 14px 35px rgba(80, 20, 35, 0.2);
      background: #fffaf7;
      border: 1px solid rgba(150, 60, 80, 0.18);
    }

    .front h2 {
      color: #8d2942;
      font-size: 25px;
      margin: 0 0 15px;
    }

    .front p {
      color: #704852;
      font-size: 16px;
    }

    .back {
      transform: rotateY(180deg);
    }

    .back h2 {
      color: #8d2942;
      font-size: 27px;
      line-height: 1.4;
      margin: 0;
    }

    .heart {
      font-size: 35px;
      margin-top: 15px;
      animation: beat 1.3s infinite;
    }

    @keyframes beat {
      50% {
        transform: scale(1.18);
      }
    }

    .hint {
      font-family: Arial, sans-serif;
      color: #9b6974;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 420px) {
      .card-container {
        width: 285px;
        height: 205px;
      }

      .roses {
        font-size: 54px;
      }
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="title" id="title">
      Tengo algo para ti... ❤️
    </div>

    <div class="gift" id="gift">
      <div class="bow">🎀</div>

      <div class="lid">
        <div class="ribbon-lid"></div>
      </div>

      <div class="box">
        <div class="ribbon-v"></div>
      </div>
    </div>

    <div class="flowers" id="flowers">
      <div class="roses">
        🌹🌹🌹<br>
        🌹💐🌹
      </div>
      <p>Para la persona que más amo ❤️</p>
    </div>

    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <div class="front">
          <h2>Eres el amor de mi vida ❤️</h2>
          <p>Y quería recordártelo de una manera diferente...</p>
          <div class="hint">Toca la carta para voltearla ↻</div>
        </div>

        <div class="back">
          <h2>
            Con mucho amor,<br>
            tu novio roncador
          </h2>
          <div class="heart">❤️</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const gift = document.getElementById("gift");
    const flowers = document.getElementById("flowers");
    const cardContainer = document.getElementById("cardContainer");
    const card = document.getElementById("card");
    const title = document.getElementById("title");

    gift.addEventListener("click", () => {
      gift.classList.add("open");
      title.innerText = "Para ti 🌹";

      setTimeout(() => {
        flowers.classList.add("show");
      }, 500);

      setTimeout(() => {
        flowers.style.opacity = "0.35";
        flowers.style.transform = "translateY(-75px) scale(0.75)";
        cardContainer.classList.add("show");
      }, 2300);
    });

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });
  </script>
</body>
</html>
