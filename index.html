<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un regalo para ti</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff1f7);
      color: #54213b;
      text-align: center;
    }

    .tarjeta {
      width: min(90%, 500px);
      padding: 40px 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 30px #0002;
    }

    h1 {
      font-size: 2.3rem;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 30px;
      background: #e75480;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #c93d68;
    }

    #mensaje {
      display: none;
      margin-top: 25px;
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="tarjeta">
    <div style="font-size: 60px;">🎁</div>
    <h1>¡Tengo un regalo para ti!</h1>
    <p>Haz clic en el botón para descubrirlo.</p>

    <button onclick="mostrarMensaje()">Abrir regalo</button>

    <div id="mensaje">
      💖 Eres una persona muy especial para mí.  
      <br>
      Espero que este pequeño detalle te haga sonreír.
    </div>
  </main>

  <script>
    function mostrarMensaje() {
      document.getElementById("mensaje").style.display = "block";
    }
  </script>
</body>
</html>
